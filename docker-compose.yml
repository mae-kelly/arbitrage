services:
  ganache:
    image: trufflesuite/ganache:latest
    ports:
      - "8545:8545"
    command: >
      --fork https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}
      --fork.blockNumber 18000000
      --accounts 10
      --deterministic
      --host 0.0.0.0
      --port 8545
      --gasLimit 30000000
      --gasPrice 20000000000
      --hardfork london
      --miner.blockGasLimit 30000000
    networks:
      - arbitrage-network
    volumes:
      - ganache-data:/ganache
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy lru
    networks:
      - arbitrage-network
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: arbitrage
      POSTGRES_USER: arbitrage_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-arbitrage_pass}
    ports:
      - "5432:5432"
    networks:
      - arbitrage-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  arbitrage-bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - ganache
      - redis
      - postgres
    environment:
      MODE: ${MODE:-test}
      ALCHEMY_KEY: ${ALCHEMY_KEY}
      INFURA_KEY: ${INFURA_KEY}
      ETHERSCAN_KEY: ${ETHERSCAN_KEY}
      WALLET_ADDRESS: ${WALLET_ADDRESS}
      PRIVATE_KEY: ${PRIVATE_KEY}
      NETWORK: ${NETWORK:-fork}
      RPC_URL: http://ganache:8545
      STRATEGIES: ${STRATEGIES:-all}
      MIN_PROFIT_USD: ${MIN_PROFIT_USD:-100}
      MAX_GAS_GWEI: ${MAX_GAS_GWEI:-50}
      USE_AAVE: ${USE_AAVE:-true}
      USE_BALANCER: ${USE_BALANCER:-true}
      USE_UNISWAP: ${USE_UNISWAP:-true}
      FLASHBOTS_ENABLED: ${FLASHBOTS_ENABLED:-false}
      PRIVATE_MEMPOOL: ${PRIVATE_MEMPOOL:-false}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://arbitrage_user:${DB_PASSWORD:-arbitrage_pass}@postgres:5432/arbitrage
      RUST_LOG: info
      RUST_BACKTRACE: 1
    networks:
      - arbitrage-network
    volumes:
      - ./target:/app/target
      - ./ml:/app/ml
      - ./logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  monitoring:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - arbitrage-network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    networks:
      - arbitrage-network
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

networks:
  arbitrage-network:
    driver: bridge

volumes:
  ganache-data:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
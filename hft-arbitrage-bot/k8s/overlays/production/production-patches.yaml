apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbitrage-bot
spec:
  template:
    spec:
      containers:
      - name: arbitrage-bot
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        env:
        - name: RUST_LOG
          value: "warn"

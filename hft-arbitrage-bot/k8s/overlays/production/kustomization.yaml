apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
- ../../base

patchesStrategicMerge:
- production-patches.yaml

replicas:
- name: arbitrage-bot
  count: 5
- name: ml-server
  count: 3

images:
- name: arbitrage-bot
  newTag: v1.0.0
- name: ml-server
  newTag: v1.0.0

commonLabels:
  environment: production

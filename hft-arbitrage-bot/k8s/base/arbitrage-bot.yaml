apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbitrage-bot
  namespace: arbitrage-system
  labels:
    app: arbitrage-bot
    tier: trading
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: arbitrage-bot
  template:
    metadata:
      labels:
        app: arbitrage-bot
        tier: trading
    spec:
      containers:
      - name: arbitrage-bot
        image: arbitrage-bot:latest
        imagePullPolicy: Always
        env:
        - name: RUST_LOG
          value: "info"
        - name: ETHEREUM_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: arbitrage-secrets
              key: ETHEREUM_PRIVATE_KEY
        - name: ALCHEMY_API_KEY
          valueFrom:
            secretKeyRef:
              name: arbitrage-secrets
              key: ALCHEMY_API_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: arbitrage-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: arbitrage-secrets
              key: REDIS_URL
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 9090
          name: prometheus
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: models
          mountPath: /app/models
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            ephemeral-storage: "1Gi"
          limits:
            memory: "4Gi"
            cpu: "2000m"
            ephemeral-storage: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
      volumes:
      - name: config
        configMap:
          name: arbitrage-config
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
      serviceAccountName: arbitrage-bot
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: arbitrage-bot
  namespace: arbitrage-system
  labels:
    app: arbitrage-bot
spec:
  selector:
    app: arbitrage-bot
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
  - name: prometheus
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: arbitrage-system
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: efs  # AWS EFS for shared storage, adjust for your provider

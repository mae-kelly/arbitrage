apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-server
  namespace: arbitrage-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-server
  template:
    metadata:
      labels:
        app: ml-server
    spec:
      containers:
      - name: ml-server
        image: ml-server:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: arbitrage-secrets
              key: REDIS_URL
        volumeMounts:
        - name: models
          mountPath: /app/models
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ml-server
  namespace: arbitrage-system
spec:
  selector:
    app: ml-server
  ports:
  - port: 8000
    targetPort: 8000

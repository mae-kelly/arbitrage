apiVersion: v1
kind: ServiceAccount
metadata:
  name: arbitrage-bot
  namespace: arbitrage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arbitrage-bot-role
  namespace: arbitrage-system
rules:
- apiGroups: [""]
  resources: ["pods", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arbitrage-bot-binding
  namespace: arbitrage-system
subjects:
- kind: ServiceAccount
  name: arbitrage-bot
  namespace: arbitrage-system
roleRef:
  kind: Role
  name: arbitrage-bot-role
  apiGroup: rbac.authorization.k8s.io

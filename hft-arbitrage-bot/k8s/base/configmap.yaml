apiVersion: v1
kind: ConfigMap
metadata:
  name: arbitrage-config
  namespace: arbitrage-system
data:
  config.toml: |
    scan_interval_seconds = 1
    
    [risk_limits]
    max_position_usd = 100000.0
    max_daily_volume_usd = 1000000.0
    max_slippage_pct = 2.0
    max_gas_price_gwei = 100.0
    min_profit_usd = 50.0
    
    [flash_loans]
    enabled = true
    max_loan_usd = 500000.0
    providers = ["aave", "dydx", "balancer"]
    gas_buffer_pct = 20.0
    
    [chains.ethereum]
    chain_id = 1
    rpc_url = "wss://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
    gas_limit = 500000
    max_gas_price_gwei = 100.0
    confirmation_blocks = 2
    enabled = true
    
    [chains.arbitrum]
    chain_id = 42161
    rpc_url = "wss://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
    gas_limit = 800000
    max_gas_price_gwei = 5.0
    confirmation_blocks = 1
    enabled = true

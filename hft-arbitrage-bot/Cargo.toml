[package]
name = "hft-arbitrage-bot"
version = "5.0.0"
edition = "2021"
description = "Cross-Chain High-Frequency Arbitrage Bot (Educational)"

[[bin]]
name = "hft-arbitrage-bot"
path = "src/main.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
futures-util = "0.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# WebSocket
tokio-tungstenite = "0.20"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Concurrent data structures
dashmap = "5.0"
parking_lot = "0.12"

# Random number generation
rand = "0.8"

# Math and statistics
statrs = "0.16"

# Database (for historical data)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Ethereum and EVM chains
ethers = { version = "2.0", features = ["ws", "rustls", "abigen"] }
ethers-providers = "2.0"
ethers-signers = "2.0"
ethers-contract = "2.0"

# Solana
solana-client = "1.16"
solana-sdk = "1.16"
anchor-client = "0.28"

# Cross-chain protocols
# Note: These are placeholder dependencies - real implementations would use official SDKs
layerzero-sdk = { git = "https://github.com/LayerZero-Labs/LayerZero", optional = true }

# Configuration
config = "0.13"
toml = "0.8"

# Metrics and monitoring
prometheus = "0.13"
metrics = "0.21"

# Command line interface
clap = { version = "4.0", features = ["derive"] }

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

[features]
default = ["simulation"]
simulation = []
mainnet = ["layerzero-sdk"]

[dev-dependencies]
tokio-test = "0.4"

# Blockchain dependencies
ethers = { version = "2.0", features = ["ws", "rustls"] }
ethers-contract = "2.0"
web3 = "0.19"
async-trait = "0.1"
hex = "0.4"

# ML Dependencies
candle-core = "0.3"
candle-nn = "0.3"
candle-transformers = "0.3"
tokenizers = "0.15"
safetensors = "0.4"
tch = "0.15"  # PyTorch bindings for Rust

# Blockchain dependencies
ethers-contract = "2.0"
web3 = "0.19"
async-trait = "0.1"
hex = "0.4"
secp256k1 = "0.27"
k256 = "0.13"
sha3 = "0.10"
rlp = "0.5"

# ML Dependencies
candle-core = "0.3"
candle-nn = "0.3"
candle-transformers = "0.3"
tokenizers = "0.15"
safetensors = "0.4"
tch = "0.15"  # PyTorch bindings for Rust
ort = "1.16"  # ONNX Runtime
rand = "0.8"

# Database dependencies
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate"] }
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }

# Performance optimization dependencies
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.24"
objc = "0.2"

# SIMD and low-level optimization
[dependencies.libc]
version = "0.2"

# Additional performance deps
num_cpus = "1.16"
rayon = "1.7"

# Additional production dependencies
nalgebra = "0.32"
rand_distr = "0.4"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"

[package]
name = "hft-arbitrage-bot"
version = "4.0.0"  # Matching Cargo.lock
edition = "2021"
description = "Cross-Chain High-Frequency Arbitrage Bot (Educational)"

[[bin]]
name = "hft-arbitrage-bot"
path = "src/main.rs"

[dependencies]
# Core dependencies (from Cargo.lock - these work together)
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
futures-util = "0.3"
parking_lot = "0.12"
rand = "0.8"
rayon = "1.11"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Additional core dependencies
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
hex = "0.4"
num_cpus = "1.16"
url = "2.4"

# Math and statistics
nalgebra = { version = "0.32", optional = true }
rand_distr = { version = "0.4", optional = true }

# WebSocket support for real-time data
tokio-tungstenite = { version = "0.20", optional = true }

# Configuration management
config = { version = "0.13", optional = true }
toml = { version = "0.8", optional = true }
clap = { version = "4.0", features = ["derive"] }

# Database support
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"], optional = true }

# Metrics and monitoring
prometheus = { version = "0.13", optional = true }

# Basic crypto utilities
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.21", optional = true }

# Blockchain dependencies (compatible versions)
# Using ethers-rs v1.0 which has better compatibility
ethers = { version = "1.0", features = ["ws", "rustls"], optional = true }
ethers-core = { version = "1.0", optional = true }
ethers-providers = { version = "1.0", optional = true }
ethers-signers = { version = "1.0", optional = true }
ethers-contract = { version = "1.0", optional = true }
ethers-middleware = { version = "1.0", optional = true }

# Alternative web3 client
web3 = { version = "0.19", optional = true }

# Crypto primitives (compatible versions)
secp256k1 = { version = "0.24", optional = true }
k256 = { version = "0.11", optional = true }
sha3 = { version = "0.10", optional = true }
rlp = { version = "0.5", optional = true }

# Additional blockchain utilities
tiny-keccak = { version = "2.0", features = ["keccak"], optional = true }
ethereum-types = { version = "0.13", optional = true }

# Solana (using older compatible versions)
solana-client = { version = "1.14", optional = true }
solana-sdk = { version = "1.14", optional = true }
spl-token = { version = "3.5", optional = true }

# Additional async utilities
futures = { version = "0.3", optional = true }

[features]
default = ["simulation"]
simulation = []
math = ["nalgebra", "rand_distr"]
websockets = ["tokio-tungstenite"]
configuration = ["config", "toml"]
database = ["sqlx"]
monitoring = ["prometheus"]
crypto = ["sha2", "base64"]

# Blockchain features
ethereum = [
    "ethers", 
    "ethers-core", 
    "ethers-providers", 
    "ethers-signers", 
    "ethers-contract", 
    "ethers-middleware",
    "secp256k1", 
    "k256", 
    "sha3", 
    "rlp",
    "tiny-keccak",
    "ethereum-types",
    "futures"
]

web3-client = ["web3", "ethereum-types", "secp256k1"]

solana = ["solana-client", "solana-sdk", "spl-token"]

# Combined features
blockchain = ["ethereum", "solana"]
full = ["math", "websockets", "configuration", "database", "monitoring", "crypto", "blockchain"]

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
# Optimization for high-frequency trading
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

[profile.dev]
# Faster compile times during development
opt-level = 0
debug = true
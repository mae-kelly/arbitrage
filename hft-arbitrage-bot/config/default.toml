# Cross-Chain HFT Arbitrage Bot Configuration

scan_interval_seconds = 10

[risk_limits]
max_position_usd = 100000.0
max_daily_volume_usd = 1000000.0
max_slippage_pct = 2.0
max_gas_price_gwei = 100.0
min_profit_usd = 50.0

[flash_loans]
enabled = true
max_loan_usd = 500000.0
providers = ["aave", "dydx", "balancer"]
gas_buffer_pct = 20.0

[bridges]
enabled = true
max_bridge_amount_usd = 100000.0
providers = ["layerzero", "stargate", "axelar"]
max_wait_time_minutes = 30

[mev_protection]
use_private_mempool = true
flashbots_enabled = true
gas_price_boost_pct = 10.0

[chains.ethereum]
chain_id = 1
rpc_url = "wss://eth-mainnet.g.alchemy.com/v2/demo"
gas_limit = 500000
max_gas_price_gwei = 100.0
confirmation_blocks = 2
enabled = true

[chains.bsc]
chain_id = 56
rpc_url = "wss://bsc-dataseed1.binance.org"
gas_limit = 300000
max_gas_price_gwei = 20.0
confirmation_blocks = 3
enabled = true

[exchanges.binance]
base_url = "https://api.binance.com"
rate_limit_ms = 100
enabled = true

[exchanges.coinbase]
base_url = "https://api.exchange.coinbase.com"
rate_limit_ms = 200
enabled = true

[package]
name = "quantum-arb"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
ethers = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
dotenv = "0.15"
web3 = "0.19"
hex = "0.4"
rust_decimal = "1.33"
rayon = "1.8"
dashmap = "5.5"
parking_lot = "0.12"
bytes = "1.5"
async-trait = "0.1"
futures = "0.3"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

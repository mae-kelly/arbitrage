[workspace]
resolver = "2"
members = [
    "src/rust/shared",
    "src/rust/price-engine", 
    "src/rust/arbitrage-detector",
    "src/rust/lightning-core",
    "src/rust/exchanges",
    "src/rust/flash-loans"
]

[package]
name = "lightning-arbitrage"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
dashmap = "5.5"
rayon = "1.8"
crossbeam = "0.8"
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.33", features = ["serde-float"] }
simd-json = "0.13"
parking_lot = "0.12"
mimalloc = "0.1"
url = "2.4"
flate2 = "1.0"
reqwest = { version = "0.11", features = ["json"] }
async-trait = "0.1"

[dependencies]
lightning-core = { path = "src/rust/lightning-core" }
exchanges = { path = "src/rust/exchanges" }
flash-loans = { path = "src/rust/flash-loans" }
shared = { path = "src/rust/shared" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
rust_decimal = { workspace = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

version: '3.8'

services:
  arbitrage-bot:
    build: .
    restart: always
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://postgres:password@db:5432/arbitrage
    depends_on:
      - db
      - redis
    networks:
      - arbitrage-net

  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=arbitrage
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - arbitrage-net

  redis:
    image: redis:7-alpine
    networks:
      - arbitrage-net

  monitoring:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - arbitrage-net

volumes:
  postgres-data:

networks:
  arbitrage-net:

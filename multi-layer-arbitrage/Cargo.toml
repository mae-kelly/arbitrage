[package]
name = "multi-layer-arbitrage"
version = "2.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"
colored = "2.0"
chrono = "0.4"
dashmap = "5.5"
crossbeam-channel = "0.5"
ethers = "2.0"
web3 = "0.19"
secp256k1 = "0.27"
hex = "0.4"
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
log = "0.4"
env_logger = "0.10"
binance = "0.19"
coinbase-pro-rs = "0.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

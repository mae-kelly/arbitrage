[system]
max_workers = 16
cache_size_mb = 512
log_level = "info"

[performance]
enable_simd = true
use_jemalloc = true
prefetch_data = true
batch_size = 1000
parallel_processing = true

[exchanges]
rate_limit_buffer = 0.8
connection_timeout_ms = 5000
max_retries = 3
health_check_interval_s = 30

[arbitrage]
min_profit_threshold = 0.001  # 0.1%
max_latency_ms = 50
simulation_mode = true

[ml]
gpu_enabled = true
model_update_interval_s = 60
feature_window_size = 100


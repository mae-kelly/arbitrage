version: '3.8'
services:
  arbitrage-bot:
    build: .
    restart: always
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/arbitrage
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "3030:3030"
    volumes:
      - ./logs:/app/logs
      
  db:
    image: postgres:15
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=arbitrage
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
      
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
      
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/arbitrage.json

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
